name: Frontend

# Runs the renderer vitest suite and typechecks the codebase.
#
# This job ensures both compiler/type checking passes and vitest tests succeed.

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "frontend/**"
      - "packages/terminal/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/src/landing/package-lock.json
            packages/terminal/package-lock.json

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        id: wasm-bindgen-cli
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.127-${{ runner.os }}

      - if: steps.wasm-bindgen-cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - run: npm ci --prefix ../packages/terminal

      - run: npm ci

      - name: Prepare pinned agent-browser runtime
        run: npm run browser-runtime:prepare -- --quiet

      - name: Install landing dependencies
        run: npm ci --prefix src/landing

      - name: Check terminal package boundaries
        run: npm --prefix ../packages/terminal run check:boundaries

      - name: Typecheck project
        run: npm run typecheck

      - name: Typecheck E2E suite
        run: npm run typecheck:e2e

      - name: Run vitest suite
        env:
          OPERATOR_AGENT_BROWSER_TEST_BINARY: ${{ github.workspace }}/frontend/agent-browser/agent-browser
        run: npx vitest run

  renderer-smoke:
    # RENDERER smoke (issue #2483, renderer slice) — the Playwright specs that run
    # the renderer under `dev:web` with an injected window.operator + fake CDC/snapshot.
    # This is fast renderer-regression coverage; it is NOT the canonical T0/P0
    # end-to-end gate. Real daemon/storage/API/preload/PTY/FS boundaries are
    # exercised by the packaged-app pod gate (#2697), not here.
    # playwright.config starts `dev:web` itself (webServer); we only need the
    # browser installed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/terminal/package-lock.json

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        id: wasm-bindgen-cli
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.127-${{ runner.os }}

      - if: steps.wasm-bindgen-cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - run: npm ci --prefix ../packages/terminal

      - run: npm ci

      - name: Typecheck e2e suite
        # Playwright transpiles specs without typechecking, so the
        # `satisfies OperatorBridge` guard in e2e/support/fake-bridge.ts (the
        # preload-drift tripwire) is only enforced by this step.
        run: npm run typecheck:e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run renderer smoke suite
        run: CI=true npm run test:e2e:renderer
