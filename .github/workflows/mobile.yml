name: Mobile

# Typechecks the frozen Expo/React Native mobile app under packages/mobile_rn.
# This tree is no longer actively developed (packages/mobile is now the
# Flutter client) so the workflow is manually triggered only, not run on push/PR.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mobile_rn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/mobile_rn/package-lock.json

      # .npmrc pins legacy-peer-deps for this package; npm ci honors it.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
