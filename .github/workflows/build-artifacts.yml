# .github/workflows/build-artifacts.yml
name: Desktop build artifacts

# Dispatchable unsigned Tauri build for an external release conductor. Builds
# the app for all four platform legs at a pinned ref with a caller-supplied
# version, uploads each installer as a short-lived run artifact, and emits a
# digests.json artifact (a flat JSON object mapping each artifact filename to
# its sha256 hex string) that the conductor reads to verify hashes before
# signing. Creates no release, references no signing secrets.
#
# Signing model under Tauri (task 18): macOS code signing happens at bundle
# time from APPLE_SIGNING_IDENTITY and updater signatures at archive time from
# TAURI_SIGNING_PRIVATE_KEY. Neither is present here, so these artifacts are
# unsigned by construction; the conductor applies identity + notarization +
# staple downstream, re-cuts the zip with scripts/package-tauri-mac-zip.sh, and
# signs updater archives with `tauri signer sign` before feeds are generated.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or SHA to build"
        type: string
        required: true
      version:
        description: "Version string to stamp into the app"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `artifact` is the pinned upload-artifact name the downstream release
          # conductor consumes; the contained filenames keep the existing stable
          # alias names so the cask/updater/landing stay compatible. Do not
          # rename either without updating the conductor.
          - os: macos-latest
            platform: darwin-arm64
            artifact: mac-arm64
          - os: macos-15-intel
            platform: darwin-x64
            artifact: mac-x64
          - os: windows-latest
            platform: win32-x64
            artifact: win
          - os: ubuntu-latest
            platform: linux-x64
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    env:
      CGO_ENABLED: 0
      # Selects the pinned toolchain for every cargo/rustc invocation in this
      # job (npm run tauri:* shells out to cargo); installing alone never
      # selects it, and the build would otherwise run on the runner's stable.
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The daemon is compiled by build-daemon.mjs before bundling, so the Go
      # toolchain must be present and pinned on every runner.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install Linux webview and packaging tooling
        if: matrix.platform == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm squashfs-tools gnupg
      - run: npm ci
      # Same stamping mechanism as testing-build.yml: rewrite package.json
      # to the caller's version, dropping any +build metadata.
      - name: Stamp version
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          node -e "const v=process.env.BUILD_VERSION.split('+')[0]; const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"
      - name: Build runtime dependencies into the bundle resources
        run: |
          npm run build:daemon
          npm run browser-runtime:prepare -- --quiet
          npm run build:acp-runtime
      - name: Build bundles (unsigned, no publish)
        shell: bash
        # The production feed base URL is baked by tauri.release.conf.json; this
        # unsigned conductor build keeps updater artifacts OFF (no signing key),
        # so it uses the base config.
        run: npm run tauri:build -- --debug
      - name: Verify baked production feed base URL
        shell: bash
        run: |
          set -euo pipefail
          grep -q "releases/latest/download" src-tauri/tauri.release.conf.json \
            || { echo "::error::tauri.release.conf.json lost the production feed base URL" >&2; exit 1; }
      - name: Collect artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/debug/bundle"
          mkdir -p dist-artifact dist-deb dist-rpm dist-macos-extra
          case "$PLATFORM" in
            darwin-*)
              ./scripts/package-tauri-mac-zip.sh "$BUNDLE/macos/Operator.app" "dist-artifact/operator-$PLATFORM.zip"
              cp "$BUNDLE"/dmg/*.dmg "dist-macos-extra/operator-$PLATFORM.dmg"
              ;;
            win32-x64)
              cp "$BUNDLE/nsis/"*-setup.exe "dist-artifact/operator-win32-x64.exe"
              ;;
            linux-x64)
              cp "$BUNDLE/appimage/"*.AppImage "dist-artifact/operator-linux-x64.AppImage"
              cp "$BUNDLE/deb/"*.deb "dist-deb/operator-linux-x64.deb"
              cp "$BUNDLE/rpm/"*.rpm "dist-rpm/operator-linux-x64.rpm"
              ;;
            *)
              echo "unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac
      - name: Verify artifacts (structural)
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ inputs.version }}"
          # This conductor build collects VERSION-FREE aliases into
          # dist-artifact (the pinned artifact-name contract) and the sibling
          # package forms into their own dirs, so the verifier is told where
          # everything lives: --expect-aliases switches the filename version
          # grep to alias layout (the version is still asserted against the
          # embedded Info.plist metadata of every inspected bundle), and each
          # --extra-dist is consulted before any class-absence failure so
          # dmg/deb/rpm are inspected where they actually live. --arch scopes
          # absence checks to this leg's arch, as in the release workflows.
          ./scripts/verify-tauri-artifacts.sh --dist dist-artifact --mode testing \
            --expect-aliases \
            --extra-dist dist-macos-extra \
            --extra-dist dist-deb \
            --extra-dist dist-rpm \
            --arch "$(uname -m | sed 's/x86_64/x64/')" \
            --expect-version "${EXPECTED%%+*}" \
            --emit-gates "artifact-gates-${{ matrix.platform }}.json"
      - name: Digest collected artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts="$(mktemp -d)"
          # Digest EVERY collected artifact class, not just the primary
          # installer: the dmg lands in dist-macos-extra and deb/rpm in their
          # own dist-* dirs, and the conductor verifies hashes for all of them
          # before signing.
          files=(dist-artifact/operator-* dist-deb/* dist-rpm/* dist-macos-extra/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no collected artifacts found to digest for $PLATFORM" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            hash="$(openssl dgst -sha256 "$f" | awk '{print $NF}')"
            name="$(basename "$f")"
            jq -n --arg f "$name" --arg h "$hash" '{($f): $h}' > "$parts/$name.json"
            echo "$PLATFORM: $name sha256=$hash" >> "$GITHUB_STEP_SUMMARY"
          done
          jq -s 'add' "$parts"/*.json > "dist-artifact/$PLATFORM.digest.json"
          rm -rf "$parts"
      - name: Upload Linux .deb artifact
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: frontend/dist-deb/operator-linux-x64.deb
          retention-days: 1
          if-no-files-found: error
      - name: Upload Linux .rpm artifact
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: frontend/dist-rpm/operator-linux-x64.rpm
          retention-days: 1
          if-no-files-found: error
      - name: Upload macOS dmg artifact
        if: startsWith(matrix.platform, 'darwin')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-dmg
          path: frontend/dist-macos-extra/operator-*.dmg
          retention-days: 1
          if-no-files-found: error
      - name: Upload gates ledger
        uses: actions/upload-artifact@v4
        with:
          name: gates-${{ matrix.platform }}
          path: frontend/artifact-gates-*.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: frontend/dist-artifact/operator-*
          retention-days: 1
          if-no-files-found: error
      # The digests job below merges these fragments (pattern digest-*) into a
      # single digests.json; without this upload it has nothing to merge.
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform }}
          path: frontend/dist-artifact/${{ matrix.platform }}.digest.json
          retention-days: 1
          if-no-files-found: error

  # Merge the per-platform digest fragments into one digests.json artifact so
  # a downstream consumer reads every expected hash from a single file.
  digests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Merge digests
        shell: bash
        run: |
          jq -s 'add' ./*.digest.json > digests.json
          { echo '### Artifact digests'; echo '```json'; cat digests.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests
          path: digests.json
          retention-days: 1
          if-no-files-found: error
