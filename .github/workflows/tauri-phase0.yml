name: Tauri Phase 0

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - "backend/internal/config/**"
      - "backend/internal/httpd/cors.go"
      - "backend/internal/httpd/cors_test.go"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/rust-toolchain.toml"
      - "frontend/scripts/audit-tauri-state.mjs"
      - "frontend/scripts/audit-tauri-state.test.mjs"
      - "frontend/scripts/agent-browser-phase0.mjs"
      - "frontend/scripts/agent-browser-phase0.test.mjs"
      - "frontend/scripts/prepare-agent-browser.mjs"
      - "frontend/perf/browser/**"
      - "frontend/src-tauri/**"
      - ".github/workflows/tauri-phase0.yml"

permissions:
  contents: read

jobs:
  state-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: npm run test:tauri-state
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cd ../backend && go test ./internal/config ./internal/httpd -run 'AllowedOrigins|CORS'
      - run: npm run typecheck
      - run: npm run tauri:build -- --debug --no-bundle
      - if: runner.os != 'Linux'
        run: npm run audit:tauri-state
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run audit:tauri-state
  agent-browser-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: node scripts/prepare-agent-browser.mjs --quiet
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/agent-browser-phase0.mjs --mode system --artifacts ./agent-browser-phase0-system
        continue-on-error: true
      - if: runner.os != 'Linux'
        run: node scripts/agent-browser-phase0.mjs --mode system --artifacts ./agent-browser-phase0-system
        continue-on-error: true
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/agent-browser-phase0.mjs --mode managed --artifacts ./agent-browser-phase0-managed
        continue-on-error: true
      - if: runner.os != 'Linux'
        run: node scripts/agent-browser-phase0.mjs --mode managed --artifacts ./agent-browser-phase0-managed
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-browser-phase0-${{ matrix.os }}
          path: |
            frontend/agent-browser-phase0-system/evidence-*.json
            frontend/agent-browser-phase0-system/*.png
            frontend/agent-browser-phase0-managed/evidence-*.json
            frontend/agent-browser-phase0-managed/*.png
          if-no-files-found: warn
