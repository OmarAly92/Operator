name: Release latest guard

# Guard against accidental non-stable GitHub releases taking over
# /releases/latest and breaking the stable channel (both the Tauri latest.json
# feed and the Electron-compatibility YAML feeds the installed fleet follows).
on:
  release:
    types: [published, edited, released]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  latest-release:
    # Stable /releases/latest only exists on the canonical repo. Forks copy
    # this workflow (including the hourly schedule) but have no desktop
    # release, so the check fails red every hour.
    if: github.repository == 'OmarAly92/operator'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(gh release view --repo "$REPO" --json tagName,isPrerelease,isDraft,assets)"
          tag="$(jq -r '.tagName' <<<"$release_json")"
          prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          draft="$(jq -r '.isDraft' <<<"$release_json")"

          echo "Latest release: $tag"

          if [[ "$draft" == "true" || "$prerelease" == "true" ]]; then
            echo "::error::GitHub latest resolved to draft/prerelease '$tag'; stable latest must be a published non-prerelease."
            exit 1
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::GitHub latest resolved to '$tag'; expected a stable semver tag like v0.10.2."
            exit 1
          fi

          mapfile -t assets < <(jq -r '.assets[].name' <<<"$release_json")
          printf 'Assets:\n%s\n' "${assets[@]}"

          required_assets=(
            latest.json
            latest.yml
            latest-mac.yml
            latest-linux.yml
            operator-darwin-arm64.zip
            operator-win32-x64.exe
            operator-linux-x64.AppImage
          )

          for required in "${required_assets[@]}"; do
            if ! printf '%s\n' "${assets[@]}" | grep -Fxq "$required"; then
              echo "::error::Latest stable release '$tag' is missing required asset '$required'."
              exit 1
            fi
          done

          # The Tauri manifest must carry every platform target with a real
          # signature, so no arch is stranded on an older version by a partial
          # or unsigned feed.
          gh release download "$tag" --repo "$REPO" --pattern 'latest.json' --dir "$RUNNER_TEMP/feed" --clobber
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms | has($p)' "$RUNNER_TEMP/feed/latest.json" >/dev/null; then
              echo "::error::latest.json on '$tag' is missing updater platform '$platform'."
              exit 1
            fi
            sig="$(jq -r --arg p "$platform" '.platforms[$p].signature // ""' "$RUNNER_TEMP/feed/latest.json")"
            if [ -z "$sig" ]; then
              echo "::error::latest.json on '$tag' has an empty signature for '$platform'."
              exit 1
            fi
          done
