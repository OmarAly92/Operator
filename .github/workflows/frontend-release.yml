name: Desktop release

# Builds and publishes the Tauri desktop app. Generates a GitHub Release with
# installers + Tauri updater feeds + Electron-compatibility YAML feeds, then
# uploads stable, version-free asset aliases so `opr start`'s constant
# releases/latest/download/<name> URL resolves.
#
# Each target OS builds on its own runner so the bundled `opr` daemon is compiled
# natively for that platform and the webview stack matches the host. The per-OS
# matrix keeps host == target.
#
# Signing model (task 18):
#   - macOS: Tauri applies the Developer ID identity during bundling
#     (APPLE_SIGNING_IDENTITY); the workflow then notarizes with notarytool,
#     staples the .app and .dmg, and cuts the permanent ditto zip from the
#     stapled bundle via scripts/package-tauri-mac-zip.sh.
#   - Updater signatures: TAURI_SIGNING_PRIVATE_KEY signs every updater archive;
#     OPERATOR_UPDATER_PUBLIC_KEY is compiled into the shell so verification
#     fails closed without it.
#   - The production feed base URL is baked from src-tauri/tauri.release.conf.json.
#
# ⚠️ Until these secrets are configured, published builds stay unsigned and will
# NOT pass Gatekeeper or verify with --strict-trust; the workflow still produces
# installable artifacts.

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      skip_e2e_gate:
        description: "Skip the advisory pod e2e gate (emergency/override)."
        type: boolean
        default: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Gates the signed release behind the `release` environment's required
    # reviewers: any write-access user can push a desktop-v* tag, but only
    # designated approvers can let the build that consumes the signing secrets
    # proceed. Configure reviewers in repo Settings > Environments > release.
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    env:
      # Compiled into the binary; a build without it fails closed at check time.
      OPERATOR_UPDATER_PUBLIC_KEY: ${{ vars.OPERATOR_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CGO_ENABLED: 0
      # Selects the pinned toolchain for every cargo/rustc invocation in this
      # job (npm run tauri:* shells out to cargo); installing alone never
      # selects it, and the build would otherwise run on the runner's stable.
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The daemon is compiled by build-daemon.mjs before the Tauri bundle, so
      # the Go toolchain must be present and pinned on every runner.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install Linux webview and packaging tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm squashfs-tools gnupg
      - run: npm ci
      - name: Build runtime dependencies into the bundle resources
        run: |
          npm run build:daemon
          npm run browser-runtime:prepare -- --quiet
          npm run build:acp-runtime
      - name: macOS signing setup
        if: startsWith(matrix.os, 'macos')
        uses: ./.github/actions/macos-signing-setup
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key-base64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Build (signed, updater artifacts)
        shell: bash
        run: |
          UPDATER_PUBKEY_OVERLAY_JSON="{\"plugins\":{\"updater\":{\"pubkey\":\"$OPERATOR_UPDATER_PUBLIC_KEY\"}}}"
          # The conf file carries an empty plugins.updater.pubkey placeholder;
          # the operational public key arrives as this build-time overlay (the
          # same key the shell compiles in via OPERATOR_UPDATER_PUBLIC_KEY).
          for i in 1 2 3; do
            if npm run tauri:release -- --config "$UPDATER_PUBKEY_OVERLAY_JSON"; then exit 0; fi
            echo "::warning::tauri build attempt $i/3 failed (transient macOS sign/notary races can surface here)"
            [ "$i" -lt 3 ] && sleep 30
          done
          echo "::error::tauri build failed after 3 attempts" >&2
          exit 1
      - name: Notarize and staple macOS artifacts
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/Operator.app"
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/app-for-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-for-notary.zip" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler staple "$DMG"
      - name: Cut the permanent macOS zip and rename updater archives
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          APP="src-tauri/target/release/bundle/macos/Operator.app"
          ARCH="$(uname -m | sed 's/x86_64/x64/')"
          BUNDLE="src-tauri/target/release/bundle"
          mkdir -p dist
          ./scripts/package-tauri-mac-zip.sh "$APP" "dist/operator-darwin-${ARCH}-${VERSION}.zip"
          cp "$BUNDLE/dmg/"*.dmg "dist/operator-darwin-${ARCH}.dmg"
          mv "$BUNDLE/macos/Operator.app.tar.gz" "dist/operator-darwin-${ARCH}-${VERSION}.app.tar.gz"
          mv "$BUNDLE/macos/Operator.app.tar.gz.sig" "dist/operator-darwin-${ARCH}-${VERSION}.app.tar.gz.sig"
      - name: Collect versioned artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/release/bundle"
          mkdir -p dist
          cp "$BUNDLE/nsis/"*-setup.exe "dist/"
          cp "$BUNDLE/nsis/"*-setup.exe.sig "dist/"
      - name: Collect versioned artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/release/bundle"
          mkdir -p dist
          cp "$BUNDLE/appimage/"*.AppImage "dist/"
          cp "$BUNDLE/appimage/"*.AppImage.sig "dist/" 2>/dev/null || true
          cp "$BUNDLE/deb/"*.deb "dist/"
          cp "$BUNDLE/rpm/"*.rpm "dist/"
      - name: Verify artifacts (structural, strict trust on this runner)
        shell: bash
        # --strict-trust fails this leg on structural violations and on a
        # FAILED seal/notarization/staple check; gaps needing conductor-held
        # material (Authenticode evidence, smoke installs, rpm -K) stay
        # recorded gates, never fatal. --arch scopes absence checks to THIS
        # leg's artifacts: each matrix runner only ever holds its own arch,
        # so sibling-arch absence is matrix topology, not a defect.
        run: >
          ./scripts/verify-tauri-artifacts.sh --dist dist --strict-trust
          --arch "$(uname -m | sed 's/x86_64/x64/')"
          --expect-version "$(node -p "require('./package.json').version")"
          --emit-gates artifact-gates.json
      - name: Publish to the v<version> release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The release is keyed off package.json's version (the Tauri bundle
          # stamps that same version), not the triggering git tag.
          TAG="v$(node -p "require('./package.json').version")"
          gh release create "$TAG" --title "$TAG" \
            --notes "Operator desktop release ${TAG}." || true
          find dist -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' -o -name '*.sig' \) -print0 |
            while IFS= read -r -d '' f; do
              echo "uploading: $f"
              gh release upload "$TAG" "$f" --clobber
            done

      # Stable, version-free asset aliases so `opr start`'s constant
      # releases/latest/download/<name> URL resolves. Each runner uploads its
      # own platform's aliases; both macOS legs cover arm64 and x64 zips+dmgs.
      - name: Upload stable asset aliases (macOS)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64) alias_zip="operator-darwin-arm64.zip"; alias_dmg="operator-darwin-arm64.dmg" ;;
            x86_64) alias_zip="operator-darwin-x64.zip"; alias_dmg="operator-darwin-x64.dmg" ;;
            *) echo "unsupported macOS arch: $ARCH" >&2; exit 1 ;;
          esac
          VERSION="$(node -p "require('./package.json').version")"
          cp "dist/operator-darwin-${ARCH/x86_64/x64}-${VERSION}.zip" "$alias_zip"
          cp "dist/operator-darwin-${ARCH/x86_64/x64}.dmg" "$alias_dmg"
          gh release upload "$TAG" "$alias_zip" "$alias_dmg" --clobber

      - name: Upload stable asset aliases (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          src="$(ls dist/*-setup.exe | head -n1)"
          cp "$src" operator-win32-x64.exe
          gh release upload "$TAG" operator-win32-x64.exe --clobber

      - name: Upload stable asset aliases (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          src="$(ls dist/*.AppImage | head -n1)"
          cp "$src" operator-linux-x64.AppImage
          gh release upload "$TAG" operator-linux-x64.AppImage --clobber

  # Dedicated Intel (darwin-x64) build leg. Kept a separate job (not in the
  # release matrix) because only a macOS host can build the x64 installer, but
  # publish-feed waits on it so the x64 entries always ship. Runner is
  # macos-15-intel: macos-13 is deprecated/has no capacity.
  release-intel:
    runs-on: macos-15-intel
    environment: release # same approval gate as the matrix release job
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    env:
      OPERATOR_UPDATER_PUBLIC_KEY: ${{ vars.OPERATOR_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CGO_ENABLED: 0
      # Same toolchain pin as the matrix release leg (see the comment there).
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: npm ci
      - run: |
          npm run build:daemon
          npm run browser-runtime:prepare -- --quiet
          npm run build:acp-runtime
      - name: macOS signing setup
        uses: ./.github/actions/macos-signing-setup
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key-base64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Build (signed, updater artifacts)
        shell: bash
        run: |
          UPDATER_PUBKEY_OVERLAY_JSON="{\"plugins\":{\"updater\":{\"pubkey\":\"$OPERATOR_UPDATER_PUBLIC_KEY\"}}}"
          # The conf file carries an empty plugins.updater.pubkey placeholder;
          # the operational public key arrives as this build-time overlay (the
          # same key the shell compiles in via OPERATOR_UPDATER_PUBLIC_KEY).
          for i in 1 2 3; do
            if npm run tauri:release -- --config "$UPDATER_PUBKEY_OVERLAY_JSON"; then exit 0; fi
            echo "::warning::tauri build attempt $i/3 failed"
            [ "$i" -lt 3 ] && sleep 30
          done
          echo "::error::tauri build failed after 3 attempts" >&2
          exit 1
      - name: Notarize, staple and package macOS x64 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          APP="src-tauri/target/release/bundle/macos/Operator.app"
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/app-for-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-for-notary.zip" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler staple "$DMG"
          mkdir -p dist
          ./scripts/package-tauri-mac-zip.sh "$APP" "dist/operator-darwin-x64-${VERSION}.zip"
          cp "$DMG" "dist/operator-darwin-x64.dmg"
          mv src-tauri/target/release/bundle/macos/Operator.app.tar.gz \
            "dist/operator-darwin-x64-${VERSION}.app.tar.gz"
          mv src-tauri/target/release/bundle/macos/Operator.app.tar.gz.sig \
            "dist/operator-darwin-x64-${VERSION}.app.tar.gz.sig"
          # Same strict-trust posture as the matrix leg's verify step. This
          # leg's dist holds ONLY x64 artifacts, so scope the absence checks
          # to darwin/x64: arm64 classes are matrix topology (the matrix leg
          # builds them), not defects.
          ./scripts/verify-tauri-artifacts.sh --dist dist --strict-trust \
            --platform darwin --arch x64 \
            --expect-version "$VERSION" --emit-gates artifact-gates.json
          gh release create "$TAG" --title "$TAG" --notes "Operator desktop release ${TAG}." || true
          gh release upload "$TAG" dist/* --clobber
          cp "dist/operator-darwin-x64-${VERSION}.zip" operator-darwin-x64.zip
          cp "dist/operator-darwin-x64.dmg" operator-darwin-x64.dmg
          gh release upload "$TAG" operator-darwin-x64.zip operator-darwin-x64.dmg --clobber

  # Advisory pod e2e gate against the just-published Linux AppImage. NON-BLOCKING:
  # publish-feed does not depend on it. Once trusted, add `e2e-gate` to
  # publish-feed's needs. Override: skip_e2e_gate input.
  e2e-gate:
    needs: [release, release-intel]
    runs-on: ubuntu-latest
    # The Environment name is load-bearing: it is stamped into the GitHub OIDC
    # token's subject (repo:<owner>/<repo>:environment:e2e-gate), which is exactly
    # what the Azure federated credential trusts. Rename here => update the FIC.
    environment: e2e-gate
    permissions:
      contents: read # actions/checkout
      checks: write # publish the opr-stable-gate check-run (supports a neutral conclusion)
      id-token: write # mint the OIDC token azure/login exchanges for an Azure token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The Daytona API key lives ONLY in Azure Key Vault — never a GitHub secret.
      - name: Install pod-runner deps
        if: ${{ inputs.skip_e2e_gate != true }}
        continue-on-error: true
        run: npm --prefix scripts ci
      - name: Azure login (OIDC, no stored secret)
        if: ${{ inputs.skip_e2e_gate != true && vars.AZURE_CLIENT_ID != '' }}
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Run pod e2e gate (advisory)
        id: gate
        if: ${{ inputs.skip_e2e_gate != true }}
        continue-on-error: true
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then
            DAYTONA_API_KEY=$(az keyvault secret show --vault-name "${{ vars.AZURE_KEYVAULT_NAME }}" --name daytona-api-key --query value -o tsv 2>/dev/null || true)
            if [ -n "$DAYTONA_API_KEY" ]; then
              echo "::add-mask::$DAYTONA_API_KEY"
              export DAYTONA_API_KEY
            fi
          fi
          tag="v$(node -p "require('./frontend/package.json').version")"
          node scripts/opr-e2e-pod-gate.mjs --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --tag "$tag" --suite T0
      - name: Azure logout (revoke az auth for the rest of the job)
        if: ${{ always() && inputs.skip_e2e_gate != true }}
        continue-on-error: true
        run: |
          az logout || true
          az account clear || true
      - name: Upload e2e artifacts
        if: ${{ always() && inputs.skip_e2e_gate != true }}
        uses: actions/upload-artifact@v4
        with:
          name: opr-stable-gate-artifacts
          path: e2e-artifacts/
          if-no-files-found: warn
      - name: Publish opr-stable-gate check
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.skip_e2e_gate }}" = "true" ]; then
            conclusion=skipped; summary="e2e gate skipped via skip_e2e_gate."
          else
            conclusion="${{ steps.gate.outputs.conclusion }}"
            case "${{ steps.gate.outputs.classification }}" in
              passed)     summary="T0 pod smoke passed." ;;
              app_failed) summary="T0 pod smoke FAILED — the app under test failed the suite." ;;
              *)          summary="Gate could not run (infra/setup: missing DAYTONA_API_KEY, Daytona unavailable, or setup error) — NOT a release-build failure." ;;
            esac
            [ -z "$conclusion" ] && conclusion=neutral
            summary="$summary  Artifacts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="opr-stable-gate" -f head_sha="$GITHUB_SHA" \
            -f status="completed" -f conclusion="$conclusion" \
            -f "output[title]=Operator stable e2e gate" -f "output[summary]=$summary"
      - name: Enforce gate (blocking mode, opt-in)
        # Advisory by default. When repo variable OPERATOR_GATE_BLOCKING=true, a real app
        # failure fails this job so that adding `e2e-gate` to `publish-feed.needs`
        # actually blocks the release. infra/neutral and skips never block — only
        # `app_failed` (a real smoke failure of the release build) does.
        if: ${{ always() && vars.OPERATOR_GATE_BLOCKING == 'true' && steps.gate.outputs.classification == 'app_failed' }}
        run: |
          echo "::error::opr-stable-gate: app smoke failed and OPERATOR_GATE_BLOCKING=true — failing the release."
          exit 1

  # After every platform has built and uploaded its installers, generate BOTH
  # feed families from the versioned assets and upload them to the same
  # release: latest.json (Tauri updater) plus latest*.yml (Electron
  # compatibility for the installed fleet, including the permanent
  # latest-mac.yml). Runs once, on Linux: it only hashes already-built assets.
  publish-feed:
    needs: [release, release-intel]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generate and upload the latest feeds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          mkdir -p dist
          gh release download "$TAG" --dir dist --clobber
          node scripts/tauri-feed.mjs dist "${TAG#v}" latest --release-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "Operator desktop release ${TAG}."
          shopt -s nullglob
          assets=(dist/latest.json dist/latest*.yml)
          if [ ${#assets[@]} -eq 0 ]; then echo "no feed assets generated" >&2; exit 1; fi
          gh release upload "$TAG" "${assets[@]}" --clobber
