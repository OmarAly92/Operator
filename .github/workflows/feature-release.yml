name: Desktop feature release

# Manual-only, per-unmerged-PR prerelease build. Produces a signed Tauri
# installer for a single PR's head SHA, published as a prerelease under the
# isolated `pr<N>` channel. This channel writes ONLY pr<N>.json plus pr<N>*.yml
# compatibility feeds — it can never disrupt stable or nightly auto-updates.
# Only one live feature build per PR is allowed; a new run deletes the previous
# one before publishing. The build jobs are gated by the `release` environment
# (same required-reviewer approval as the stable release workflow).
# Cross-repository PRs are rejected unless `allow_fork` is set.
#
# QUOTA: at most 5 active feature releases are allowed at once. If the limit
# is hit, retire (delete) an old one before triggering a new build.
#
# Version format: <base>-pr<N>.<UTCts>+<sha>  (computed in the guard job via
# the GitHub contents API + bash; no PR-controlled code ever executes there)
# Feed channel:   pr<N>          (e.g. pr42.json, pr42.yml, pr42-mac.yml)

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to build (required)"
        required: true
        type: string
      slug:
        description: "Short label for the build (display only, optional)"
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma-separated platforms to build (default: mac,win,linux)"
        required: false
        type: string
        default: "mac,win,linux"
      allow_fork:
        description: "Allow cross-repository (fork) PRs"
        required: false
        type: boolean
        default: false

jobs:
  # ── guard ─────────────────────────────────────────────────────────────────
  # Validates the PR, enforces the active-build quota, and computes the version.
  # Runs on ubuntu with no environment and no secrets so it can be inspected
  # freely; secrets are consumed only in the gated build jobs below.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      headSha: ${{ steps.pr.outputs.headSha }}
      shortSha: ${{ steps.pr.outputs.shortSha }}
      title: ${{ steps.pr.outputs.title }}
      base: ${{ steps.version.outputs.base }}
      channel: ${{ steps.version.outputs.channel }}
      build_mac: ${{ steps.platforms.outputs.build_mac }}
      build_win: ${{ steps.platforms.outputs.build_win }}
      build_linux: ${{ steps.platforms.outputs.build_linux }}
    steps:
      - name: Parse platform matrix
        id: platforms
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          build_mac=false; build_win=false; build_linux=false
          IFS=',' read -ra parts <<< "$PLATFORMS"
          for p in "${parts[@]}"; do
            p="${p// /}"
            case "$p" in
              mac)   build_mac=true ;;
              win)   build_win=true ;;
              linux) build_linux=true ;;
              *) echo "::warning::Unknown platform '$p' ignored" ;;
            esac
          done
          {
            echo "build_mac=$build_mac"
            echo "build_win=$build_win"
            echo "build_linux=$build_linux"
          } >> "$GITHUB_OUTPUT"

      - name: "Quota check: at most 5 active feature releases"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          # Count UNIQUE, non-expired feature releases whose associated PR is
          # still open. If >= 5, fail fast.
          cutoff="$(date -u -d '7 days ago' +%s)"
          declare -A seen
          active=0
          while IFS=$'\t' read -r published_at body; do
            json="$(echo "$body" | sed -n 's/.*<!-- opr-feature-build: \(.*\) -->.*/\1/p')"
            if [ -z "$json" ]; then continue; fi
            pr_num="$(echo "$json" | jq -r '.pr' 2>/dev/null)" || true
            if [ -z "$pr_num" ] || [ "$pr_num" = "null" ]; then continue; fi
            if [ "$pr_num" = "$PR_NUMBER" ]; then continue; fi
            if [ -n "${seen[$pr_num]:-}" ]; then continue; fi
            published_ts="$(date -u -d "$published_at" +%s 2>/dev/null || echo 0)"
            if [ "$published_ts" -lt "$cutoff" ]; then continue; fi
            state="$(gh api "repos/$REPO/pulls/$pr_num" --jq '.state' 2>/dev/null || echo closed)"
            if [ "$state" = "open" ]; then
              seen[$pr_num]=1
              active=$((active + 1))
            fi
          done < <(gh api "repos/$REPO/releases?per_page=100" --jq '.[] | select(.prerelease) | select(.body != null) | select(.body | contains("<!-- opr-feature-build:")) | [.published_at, .body] | @tsv')
          echo "Active feature releases: $active"
          if [ "$active" -ge 5 ]; then
            echo "::error::5 feature releases active - retire one first."
            exit 1
          fi

      - name: Resolve PR head and validate
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          ALLOW_FORK: ${{ inputs.allow_fork }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,state,title,isCrossRepository)"
          state="$(echo "$pr_json" | jq -r '.state')"
          is_cross="$(echo "$pr_json" | jq -r '.isCrossRepository')"
          head_sha="$(echo "$pr_json" | jq -r '.headRefOid')"
          title="$(echo "$pr_json" | jq -r '.title')"

          if [ "$state" != "OPEN" ]; then
            echo "::error::PR #$PR_NUMBER is not open (state=$state). Feature builds require an open PR."
            exit 1
          fi

          if [ "$is_cross" = "true" ] && [ "$ALLOW_FORK" != "true" ]; then
            echo "::error::PR #$PR_NUMBER is from a fork. Set allow_fork=true to build fork PRs."
            exit 1
          fi

          short_sha="${head_sha:0:7}"
          {
            echo "headSha=$head_sha"
            echo "shortSha=$short_sha"
            printf 'title=%s\n' "$title"
          } >> "$GITHUB_OUTPUT"

      - name: Read PR head package.json version (no checkout, no code execution)
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ steps.pr.outputs.headSha }}
          SHORT_SHA: ${{ steps.pr.outputs.shortSha }}
        run: |
          # Fetch frontend/package.json AT THE PR HEAD via the contents API
          # and read .version with jq. This never checks out the PR head and
          # never runs any file from it - guard has no `environment:` gate,
          # so anything it executed from PR-controlled content would bypass
          # the release approval gate.
          base="$(gh api "repos/$REPO/contents/frontend/package.json?ref=$HEAD_SHA" --jq '.content' | base64 -d | jq -r '.version')"
          if [ -z "$base" ] || [ "$base" = "null" ]; then
            echo "::error::Could not read frontend/package.json version at $HEAD_SHA"
            exit 1
          fi
          bare="${base#desktop-}"
          bare="${bare#v}"
          ts="$(date -u +%Y%m%d%H%M)"
          version="${bare}-pr${PR_NUMBER}.${ts}+${SHORT_SHA}"
          tag="v${version%%+*}"
          channel="pr${PR_NUMBER}"
          {
            echo "base=$bare"
            echo "version=$version"
            echo "tag=$tag"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          echo "Computed version: $version  tag: $tag  channel: $channel"

  # ── release (matrix) ──────────────────────────────────────────────────────
  # Gated by the `release` environment (same required-reviewer approval as
  # stable). Checks out the PR head SHA so we build exactly what the PR author
  # pushed.
  release:
    needs: guard
    if: >-
      needs.guard.outputs.build_mac == 'true' ||
      needs.guard.outputs.build_win == 'true' ||
      needs.guard.outputs.build_linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    env:
      OPERATOR_UPDATER_PUBLIC_KEY: ${{ vars.OPERATOR_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CGO_ENABLED: 0
      # Selects the pinned toolchain for every cargo/rustc invocation in this
      # job (npm run tauri:* shells out to cargo); installing alone never
      # selects it, and the build would otherwise run on the runner's stable.
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - name: Skip if platform not requested
        id: gate
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PLATFORM: ${{ matrix.platform }}
          BUILD_MAC: ${{ needs.guard.outputs.build_mac }}
          BUILD_WIN: ${{ needs.guard.outputs.build_win }}
          BUILD_LINUX: ${{ needs.guard.outputs.build_linux }}
        run: |
          skip=false
          case "$PLATFORM" in
            mac)   [ "$BUILD_MAC"   = "true" ] || skip=true ;;
            win)   [ "$BUILD_WIN"   = "true" ] || skip=true ;;
            linux) [ "$BUILD_LINUX" = "true" ] || skip=true ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ needs.guard.outputs.headSha }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: rustup toolchain install 1.96.0 --profile minimal
        if: steps.gate.outputs.skip != 'true'

      - name: Install Linux webview and packaging tooling
        if: steps.gate.outputs.skip != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm squashfs-tools gnupg

      - run: npm ci
        if: steps.gate.outputs.skip != 'true'

      - name: Build runtime dependencies into the bundle resources
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm run build:daemon
          npm run browser-runtime:prepare -- --quiet
          npm run build:acp-runtime

      - name: Stamp feature version
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          FEATURE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # Strip +build metadata: Tauri stamps package.json's version with the
          # semver pre-release portion only; the release is tagged v<that>.
          node -e "const v=process.env.FEATURE_VERSION.split('+')[0]; const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"

      - name: macOS signing setup
        if: steps.gate.outputs.skip != 'true' && startsWith(matrix.os, 'macos')
        uses: ./.github/actions/macos-signing-setup
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key-base64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build (signed, updater artifacts)
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          UPDATER_PUBKEY_OVERLAY_JSON="{\"plugins\":{\"updater\":{\"pubkey\":\"$OPERATOR_UPDATER_PUBLIC_KEY\"}}}"
          # The conf file carries an empty plugins.updater.pubkey placeholder;
          # the operational public key arrives as this build-time overlay (the
          # same key the shell compiles in via OPERATOR_UPDATER_PUBLIC_KEY).
          for i in 1 2 3; do
            if npm run tauri:release -- --config "$UPDATER_PUBKEY_OVERLAY_JSON"; then exit 0; fi
            echo "::warning::tauri build attempt $i/3 failed"
            [ "$i" -lt 3 ] && sleep 30
          done
          echo "::error::tauri build failed after 3 attempts" >&2
          exit 1

      - name: Notarize, staple and collect macOS artifacts
        if: steps.gate.outputs.skip != 'true' && startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          APP="src-tauri/target/release/bundle/macos/Operator.app"
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/app-for-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-for-notary.zip" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler staple "$DMG"
          mkdir -p dist
          ARCH="$(uname -m | sed 's/x86_64/x64/')"
          ./scripts/package-tauri-mac-zip.sh "$APP" "dist/operator-darwin-${ARCH}-${VERSION}.zip"
          cp "$DMG" "dist/operator-darwin-${ARCH}.dmg"
          mv src-tauri/target/release/bundle/macos/Operator.app.tar.gz \
            "dist/operator-darwin-${ARCH}-${VERSION}.app.tar.gz"
          mv src-tauri/target/release/bundle/macos/Operator.app.tar.gz.sig \
            "dist/operator-darwin-${ARCH}-${VERSION}.app.tar.gz.sig"

      - name: Collect Windows artifacts
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/release/bundle"
          mkdir -p dist
          cp "$BUNDLE/nsis/"*-setup.exe dist/
          cp "$BUNDLE/nsis/"*-setup.exe.sig dist/

      - name: Collect Linux artifacts
        if: steps.gate.outputs.skip != 'true' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/release/bundle"
          mkdir -p dist
          cp "$BUNDLE/appimage/"*.AppImage dist/
          cp "$BUNDLE/appimage/"*.AppImage.sig dist/ 2>/dev/null || true
          cp "$BUNDLE/deb/"*.deb dist/
          cp "$BUNDLE/rpm/"*.rpm dist/

      - name: Verify artifacts (structural, strict trust on this runner)
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        # --strict-trust fails this leg on structural violations and on a
        # FAILED seal/notarization/staple check; gaps needing conductor-held
        # material (Authenticode evidence, smoke installs, rpm -K) stay
        # recorded gates, never fatal. --arch scopes absence checks to THIS
        # leg's artifacts: each matrix runner only ever holds its own arch,
        # so sibling-arch absence is matrix topology, not a defect.
        run: >
          ./scripts/verify-tauri-artifacts.sh --dist dist --strict-trust
          --arch "$(uname -m | sed 's/x86_64/x64/')"
          --expect-version "$(node -p "require('./package.json').version")"
          --emit-gates artifact-gates.json

      - name: Publish to the v<version> prerelease
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Operator desktop feature build ${TAG}." || true
          find dist -type f -print0 | while IFS= read -r -d '' f; do
            echo "uploading: $f"
            gh release upload "$TAG" "$f" --clobber
          done

  # ── release-intel (dedicated darwin-x64 leg) ──────────────────────────────
  # Only macOS can build the x64 installer; this job is separate from the
  # matrix so publish-feed can wait on it. Runner is macos-15-intel.
  release-intel:
    needs: guard
    if: needs.guard.outputs.build_mac == 'true'
    runs-on: macos-15-intel
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    env:
      OPERATOR_UPDATER_PUBLIC_KEY: ${{ vars.OPERATOR_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CGO_ENABLED: 0
      # Same toolchain pin as the matrix release leg (see the comment there).
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.headSha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: rustup toolchain install 1.96.0 --profile minimal

      - run: npm ci

      - name: Build runtime dependencies into the bundle resources
        run: |
          npm run build:daemon
          npm run browser-runtime:prepare -- --quiet
          npm run build:acp-runtime

      - name: Stamp feature version
        shell: bash
        env:
          FEATURE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          node -e "const v=process.env.FEATURE_VERSION.split('+')[0]; const fs=require('fs'); const p=require('./package.json'); p.version=v; fs.writeFileSync('./package.json', JSON.stringify(p,null,'\t')+'\n');"

      - name: macOS signing setup
        uses: ./.github/actions/macos-signing-setup
        with:
          csc-link: ${{ secrets.CSC_LINK }}
          csc-key-password: ${{ secrets.CSC_KEY_PASSWORD }}
          apple-api-key-base64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Build (signed, updater artifacts)
        shell: bash
        run: |
          UPDATER_PUBKEY_OVERLAY_JSON="{\"plugins\":{\"updater\":{\"pubkey\":\"$OPERATOR_UPDATER_PUBLIC_KEY\"}}}"
          # The conf file carries an empty plugins.updater.pubkey placeholder;
          # the operational public key arrives as this build-time overlay (the
          # same key the shell compiles in via OPERATOR_UPDATER_PUBLIC_KEY).
          for i in 1 2 3; do
            if npm run tauri:release -- --config "$UPDATER_PUBKEY_OVERLAY_JSON"; then exit 0; fi
            echo "::warning::tauri build attempt $i/3 failed"
            [ "$i" -lt 3 ] && sleep 30
          done
          echo "::error::tauri build failed after 3 attempts" >&2
          exit 1

      - name: Notarize, staple and collect macOS x64 artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          APP="src-tauri/target/release/bundle/macos/Operator.app"
          DMG="$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -n1)"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/app-for-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-for-notary.zip" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$APP"
          xcrun stapler staple "$DMG"
          mkdir -p dist
          ./scripts/package-tauri-mac-zip.sh "$APP" "dist/operator-darwin-x64-${VERSION}.zip"
          cp "$DMG" "dist/operator-darwin-x64.dmg"
          mv src-tauri/target/release/bundle/macos/Operator.app.tar.gz \
            "dist/operator-darwin-x64-${VERSION}.app.tar.gz"
          mv src-tauri/target/release/bundle/macos/Operator.app.tar.gz.sig \
            "dist/operator-darwin-x64-${VERSION}.app.tar.gz.sig"
          # Same strict-trust posture as the matrix leg's verify step. This
          # leg's dist holds ONLY x64 artifacts, so scope the absence checks
          # to darwin/x64: arm64 classes are matrix topology (the matrix leg
          # builds them), not defects.
          ./scripts/verify-tauri-artifacts.sh --dist dist --strict-trust \
            --platform darwin --arch x64 \
            --expect-version "$VERSION" --emit-gates artifact-gates.json
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Operator desktop feature build ${TAG}." || true
          gh release upload "$TAG" dist/* --clobber

  # ── publish-feed ──────────────────────────────────────────────────────────
  # Generates the pr<N> feeds from the versioned prerelease assets — BOTH feed
  # families: pr<N>.json (Tauri updater) and pr<N>*.yml (Electron
  # compatibility). Includes a hard guard that rejects any feed file that
  # would write latest* or nightly* manifests. Gated by the `release`
  # environment: this job also deletes/renames GitHub releases with
  # `contents: write`, so it must never run on PR-controlled code without the
  # same approval the build jobs require. `always()` is kept so our own
  # success checks below run instead of the default skip behavior
  # (release-intel is legitimately skipped when mac isn't requested); we then
  # require release to have actually succeeded and release-intel to not have
  # failed.
  publish-feed:
    needs: [guard, release, release-intel]
    if: >-
      always() &&
      needs.guard.result == 'success' &&
      needs.release.result == 'success' &&
      needs.release-intel.result != 'failure'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.headSha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generate the pr<N> feeds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEATURE_VERSION: ${{ needs.guard.outputs.version }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          version="${FEATURE_VERSION%%+*}"
          tag="v$version"
          channel="pr${PR_NUMBER}"
          mkdir -p dist
          gh release download "$tag" --dir dist --clobber
          node scripts/tauri-feed.mjs dist "$version" "$channel" --release-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: "Guard: assert feed channel and reject latest*/nightly* assets"
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          channel="pr${PR_NUMBER}"
          # Validate channel matches ^pr[0-9]+$
          if ! echo "$channel" | grep -qP '^pr[0-9]+$'; then
            echo "::error::Feed channel '$channel' does not match ^pr[0-9]+$ - aborting to protect stable/nightly channels."
            exit 1
          fi
          # Reject any generated feed file that matches latest* or nightly*.
          shopt -s nullglob
          bad_files=()
          for f in dist/latest*.yml dist/latest*.json dist/nightly*.yml dist/nightly*.json; do
            [ -f "$f" ] && bad_files+=("$f")
          done
          if [ ${#bad_files[@]} -gt 0 ]; then
            echo "::error::Feed guard triggered: found forbidden manifest(s): ${bad_files[*]}. Feature builds must not write latest* or nightly* manifests."
            exit 1
          fi
          echo "Feed guard passed: channel='$channel', no latest*/nightly* manifests found."

      - name: Upload pr<N> feed assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr }}
          FEATURE_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          version="${FEATURE_VERSION%%+*}"
          tag="v$version"
          channel="pr${PR_NUMBER}"
          shopt -s nullglob
          assets=(dist/"${channel}".json dist/"${channel}"*.yml)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No feed assets generated for channel '$channel'" >&2
            exit 1
          fi
          gh release upload "$tag" "${assets[@]}" --clobber

      - name: Delete prior feature releases for this PR (one live build per PR)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          matching="$(gh api "repos/$REPO/releases?per_page=100" --jq \
            ".[] | select(.prerelease) | select(.tag_name | test(\"-pr${PR_NUMBER}\\\\.\")) | select(.tag_name != \"${TAG}\") | .tag_name")"
          if [ -z "$matching" ]; then
            echo "No prior feature release found for PR #$PR_NUMBER."
          else
            while IFS= read -r old_tag; do
              echo "Deleting prior feature release: $old_tag"
              gh release delete "$old_tag" --repo "$REPO" --cleanup-tag --yes || true
            done <<< "$matching"
          fi

      - name: Annotate release with feature metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr }}
          TAG: ${{ needs.guard.outputs.tag }}
          TITLE: ${{ needs.guard.outputs.title }}
          BASE: ${{ needs.guard.outputs.base }}
          SHORT_SHA: ${{ needs.guard.outputs.shortSha }}
          SLUG: ${{ inputs.slug }}
        run: |
          payload="$(jq -nc \
            --argjson pr "${PR_NUMBER}" \
            --arg base "${BASE}" \
            --arg sha "${SHORT_SHA}" \
            --arg slug "${SLUG}" \
            '{pr: $pr, base: $base, sha: $sha, slug: $slug}')"
          marker="<!-- opr-feature-build: ${payload} -->"
          current_body="$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body' 2>/dev/null || echo '')"
          new_body="${current_body}"$'\n'"${marker}"
          gh release edit "$TAG" \
            --repo "$REPO" \
            --title "[feature] PR #${PR_NUMBER}: ${TITLE}" \
            --notes "$new_body"
