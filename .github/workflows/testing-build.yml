name: Testing build (all platforms)

# Unsigned Tauri testing builds for Linux + Windows + macOS in one matrix.
# Click "Run workflow" in the Actions tab, or push a 0.0.0-testing-* tag. All
# jobs publish to a single 0.0.0-testing-<short-sha> prerelease (distinct asset
# names).
#
# This is the ONLY desktop testing pipeline since task 18: the former disabled
# desktop-testing.yml Electron pipeline was retired rather than ported, so no
# parallel stale workflow remains.
#
# Per OS: macOS .app/.zip/.dmg, Windows NSIS .exe, Linux AppImage/.deb/.rpm —
# all unsigned, so macOS is quarantined once downloaded
# (xattr -dr com.apple.quarantine "Operator.app") and Windows SmartScreen warns.
# No updater archives are produced: createUpdaterArtifacts stays off without the
# TAURI_SIGNING_PRIVATE_KEY, and scripts/verify-tauri-artifacts.sh --mode
# testing records that as a gate instead of a failure.

on:
  workflow_dispatch:
  push:
    tags:
      - "0.0.0-testing-*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    env:
      # Pure-Go sqlite (modernc) needs no cgo; on Linux this also keeps the daemon
      # static and portable across glibc.
      CGO_ENABLED: 0
      # Selects the pinned toolchain for every cargo/rustc invocation in this
      # job (npm run tauri:* shells out to cargo); installing alone never
      # selects it, and the build would otherwise run on the runner's stable.
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Install Linux webview and packaging tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm squashfs-tools gnupg
      - run: npm ci
      - name: Prepare bundled runtime dependencies
        run: |
          npm run build:daemon
          npm run browser-runtime:prepare -- --quiet
          npm run build:acp-runtime
      - name: Build (unsigned)
        run: npm run tauri:build -- --debug
      - name: Collect bundle outputs
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/debug/bundle"
          mkdir -p dist
          case "$(uname -s)" in
            Darwin)
              ./scripts/package-tauri-mac-zip.sh "$BUNDLE/macos/Operator.app" "dist/operator-darwin-arm64-testing.zip"
              cp "$BUNDLE/dmg/"*.dmg dist/ ;;
            MINGW*|MSYS*|Windows_NT)
              cp "$BUNDLE/nsis/"*-setup.exe dist/ ;;
            Linux)
              cp "$BUNDLE/appimage/"*.AppImage dist/
              cp "$BUNDLE/deb/"*.deb dist/
              cp "$BUNDLE/rpm/"*.rpm dist/ ;;
          esac
      - name: Verify artifacts (structural; unsigned gates recorded)
        shell: bash
        run: ./scripts/verify-tauri-artifacts.sh --dist dist --mode testing
      - name: Publish to a 0.0.0-testing-<sha> prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Tag push: use the pushed tag. Manual run: mint 0.0.0-testing-<sha>.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="0.0.0-testing-${GITHUB_SHA::7}"
          fi
          # Matrix jobs race here; first one creates the release, the rest hit
          # "already exists" which is fine (|| true). Distinct asset names +
          # --clobber make uploads idempotent across re-runs.
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Unsigned Tauri testing build (macOS zip+dmg / Windows NSIS / Linux AppImage+deb+rpm). Not signed; for testing only." \
            || true
          find dist -type f -print0 | while IFS= read -r -d '' f; do
            echo "uploading: $f"
            gh release upload "$TAG" "$f" --clobber
          done

      # Smoke-install the NSIS installer on a clean, native x64 Windows runner.
      # This is a build-vs-host verdict: if it installs here it proves the
      # artifact is good and a failing user machine is host-side
      # (AV/disk/signing). continue-on-error so a failed install never blocks
      # publishing the artifacts.
      - name: Smoke-install the Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { Write-Host '::error::no NSIS installer (.exe) collected'; exit 1 }
          Write-Host "Running $($setup.FullName) /S (silent)"
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru -Wait
          Write-Host "Installer exit code: $($proc.ExitCode)"
          $installDir = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Operator'),
            (Join-Path ${env:ProgramFiles} 'Operator')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($installDir) {
            Write-Host "INSTALL OK: $installDir created"
            Get-ChildItem $installDir | Select-Object Name | Format-Table -AutoSize
          } else {
            Write-Host "::warning::INSTALL: no known install dir found (checked LOCALAPPDATA\Programs and Program Files)"
          }

      - name: Inspect Linux package contents on the native runner
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb | head -n1)"
          dpkg-deb -c "$deb" | head -40
          dpkg-deb -c "$deb" | grep -q "usr/bin/operator" || { echo "::error::deb missing usr/bin/operator"; exit 1; }
          rpm="$(ls dist/*.rpm | head -n1)"
          rpm -qlp "$rpm" | grep -q "usr/bin/operator" || { echo "::error::rpm missing usr/bin/operator"; exit 1; }
