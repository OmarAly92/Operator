name: macOS update e2e

# End-to-end macOS auto-update test: install version N-1, point it at version
# N's REAL published feed, and prove the Tauri updater engine checks, downloads,
# signature-verifies and STAGES version N. With --expect-stage-only (the mode
# this workflow runs while the project-owned verified apply path is pending)
# staging is the assertion; full install mode additionally proves the quit-swap,
# relaunch and daemon liveness once apply lands.
#
# This is POST-RELEASE MONITORING, NOT A PROMOTION GATE. Read that literally
# before wiring it anywhere.
#
# The app resolves the update through the REAL published feed, so this job
# cannot start until version N's release and its feeds are already public. By
# then every real stable client can already see and take that update, and the
# run takes tens of minutes. A check that finishes after the thing it guards has
# shipped is not a gate; calling it one would be worse than not having it.
#
# Requires, both hard:
#   - The baseline release's signed macOS zip alias is published.
#   - The target version's release and latest.json / latest-mac.yml feeds are
#     already live.

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: "Release tag to install as N-1 (e.g. v0.10.3)"
        required: true
        type: string
      target_version:
        description: "Version the app must end up on, no leading v (e.g. 0.10.4)"
        required: true
        type: string
      channel:
        description: "Update channel to run the test on"
        required: false
        default: latest
        type: string
      mode:
        description: "stage-only or full-install"
        required: false
        default: stage-only
        type: choice
        options: [stage-only, full-install]
  workflow_call:
    inputs:
      baseline_tag:
        required: true
        type: string
      target_version:
        required: true
        type: string
      channel:
        required: false
        default: latest
        type: string
      mode:
        required: false
        default: stage-only
        type: string

permissions:
  contents: read

jobs:
  update-e2e:
    # macos-latest is Apple silicon, so the arm64 asset is the one under test.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Record start time
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Download the baseline (N-1) macOS build
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline"
          # The version-free alias is published for every release (see
          # frontend/docs/desktop-release.md), so this name is stable across tags.
          gh release download "$BASELINE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'operator-darwin-arm64.zip' \
            --dir "$RUNNER_TEMP/baseline"

      - name: Verify the baseline artifact is sealed, notarized and stapled
        # Same canonical script the release pipeline's post-staple gate uses.
        # An unsigned or unstapled baseline cannot auto-update, so a failure
        # here is a real signal, not harness noise.
        run: frontend/scripts/verify-mac-artifact.sh "$RUNNER_TEMP/baseline/operator-darwin-arm64.zip"

      - name: Install the baseline into /Applications
        run: |
          set -euo pipefail
          rm -rf "/Applications/Operator.app"
          # ditto, never unzip: plain unzip leaves stray AppleDouble files inside
          # the bundle and breaks the seal (see verify-mac-artifact.sh).
          ditto -x -k "$RUNNER_TEMP/baseline/operator-darwin-arm64.zip" /Applications
          plutil -extract CFBundleShortVersionString raw -o - \
            "/Applications/Operator.app/Contents/Info.plist"

      - name: Check the baseline is the Tauri shell
        # The harness drives the Tauri updater engine only. An Electron bundle
        # has no engine, no staging record and no daemon settings PATCH path,
        # so the run could only ever burn the full download timeout and report
        # a "never staged" failure that looks like a broken update. Same check
        # the harness makes, hoisted into its own step so an incapable baseline
        # is unmistakable in the log.
        run: |
          set -euo pipefail
          identifier="$(plutil -extract CFBundleIdentifier raw -o - \
            "/Applications/Operator.app/Contents/Info.plist")"
          if [ "$identifier" != "dev.operator.desktop" ]; then
            echo "::error::baseline is '$identifier', expected dev.operator.desktop; pick a Tauri-era release"
            exit 1
          fi

      - name: Run the update end to end
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          CHANNEL: ${{ inputs.channel }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          flags=(--app "/Applications/Operator.app" --expect-version "$TARGET_VERSION" --channel "$CHANNEL")
          if [ "$MODE" != "full-install" ]; then flags+=(--expect-stage-only); fi
          node frontend/scripts/e2e-mac-update.mjs "${flags[@]}"

      - name: Verify the installed app after the update
        # The swap (when running full-install) is done by the apply step, not by
        # our signing pipeline, so re-run the full trio on what ended up on disk.
        if: always()
        run: frontend/scripts/verify-mac-artifact.sh "/Applications/Operator.app"

      - name: Verify the updated app bakes the production feed base URL
        # The update above already proved the REAL published feed resolves. This
        # step closes the remaining drift gap: version N must have been built
        # with tauri.release.conf.json baking the canonical production base URL.
        # Assert the BASE URL alone: the engine joins baked base + channel
        # manifest at runtime, so no contiguous "<base>latest.json" literal
        # exists in the binary to grep for.
        run: |
          set -euo pipefail
          binary="/Applications/Operator.app/Contents/MacOS/operator"
          if strings "$binary" | grep -q "github.com/OmarAly92/operator/releases/latest/download/"; then
            echo "updated app embeds the production feed base URL"
          else
            echo "::error::updated app does not carry the baked production feed base URL" >&2
            exit 1
          fi

      - name: Report runner cost
        if: always()
        env:
          STARTED: ${{ steps.clock.outputs.started }}
        run: |
          set -euo pipefail
          elapsed=$(( $(date +%s) - STARTED ))
          echo "macOS update e2e wall clock: $(( elapsed / 60 ))m $(( elapsed % 60 ))s" >> "$GITHUB_STEP_SUMMARY"
