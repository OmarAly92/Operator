[workspace]
members = ["crates/marks", "crates/vt-core", "crates/vt-wasm"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"
license = "MIT"
repository = "https://github.com/OmarAly92/operator"

[workspace.dependencies]
unicode-width = "=0.2.2"
vte = { version = "=0.15.0", default-features = false }
wasm-bindgen = "=0.2.127"
