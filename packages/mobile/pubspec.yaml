name: operator_mobile
description: "Flutter client for the Operator daemon."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

workspace:
  - packages/xterm
  - packages/speech_to_text
  - packages/speech_to_text_platform_interface
  - packages/expressive_loading_indicator
  - packages/expressive_refresh_indicator
  - packages/expressive_sheet
  - packages/expressive_snack
  - packages/material_shapes

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.10.0
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  easy_localization: ^3.0.7+1
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  talker: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_bloc_logger: ^5.1.17
  talker_flutter: ^5.1.17
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.2
  mobile_scanner: ^7.4.0
  web_socket_channel: ^3.0.3
  permission_handler: ^13.0.1
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  image_picker: ^1.2.3
  file_selector: ^1.1.0
  xterm:
  speech_to_text:
  speech_to_text_platform_interface:
  expressive_loading_indicator:
  expressive_refresh_indicator:
  expressive_sheet:
  expressive_snack:
  material_shapes:
  webview_flutter: ^4.14.1
  app_links: ^7.2.1
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  fake_async: ^1.3.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/agents/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Anthropic Sans Text
      fonts:
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-300.otf
          weight: 300
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-400.otf
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-400-Italic.otf
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-500.otf
          weight: 500
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-500-Italic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-600.otf
          weight: 600
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-700.otf
          weight: 700
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-700-Italic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-800.otf
          weight: 800
        - asset: assets/fonts/anthropic_sans/AnthropicSansText-800-Italic.otf
          weight: 800
          style: italic
    - family: Anthropic Sans Display
      fonts:
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-300.otf
          weight: 300
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-400.otf
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-400-Italic.otf
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-500.otf
          weight: 500
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-500-Italic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-600.otf
          weight: 600
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-700.otf
          weight: 700
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-700-Italic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-800.otf
          weight: 800
        - asset: assets/fonts/anthropic_sans/AnthropicSansDisplay-800-Italic.otf
          weight: 800
          style: italic
