[package]
name = "operator"
version = "0.10.3"
description = "Operator desktop application"
authors = ["Operator"]
edition = "2021"
rust-version = "1.96.0"

[lib]
name = "operator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = { version = "=0.22.1", features = [] }
chrono = { version = "=0.4.45", features = [] }
global-hotkey = { version = "=0.8.0", features = [] }
libc = { version = "=0.2.189", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = [] }
semver = { version = "=1.0.28", features = [] }
tauri = { version = "=2.11.5", features = ["devtools", "image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = { version = "=2.3.2", features = [] }
tauri-plugin-dialog = { version = "=2.7.2", features = [] }
tauri-plugin-global-shortcut = { version = "=2.3.2", features = [] }
tauri-plugin-notification = { version = "=2.3.3", features = [] }
tauri-plugin-wdio = { version = "=1.3.0", optional = true, features = [] }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true, features = [] }
tauri-plugin-opener = { version = "=2.5.4", features = [] }
tauri-plugin-updater = { version = "=2.10.1", features = [] }
tokio = { version = "=1.53.1", features = ["full"] }
uuid = { version = "=1.24.1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
